<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="t d"><title id="t">FinReason animated formula discovery universe</title><desc id="d">An animated isometric network connects financial examples to a discovered formula, a chained intermediate expression, and exact rational verification.</desc><defs><radialGradient id="bg"><stop stop-color="#142c43"/><stop offset="1" stop-color="#050b14"/></radialGradient><linearGradient id="teal"><stop stop-color="#5effd0"/><stop offset="1" stop-color="#3b9ca7"/></linearGradient><linearGradient id="violet"><stop stop-color="#b7a0ff"/><stop offset="1" stop-color="#6554c7"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse"><path d="M54 0H0V54" fill="none" stroke="#24425b" stroke-width="1" opacity=".4"/></pattern></defs><rect width="1600" height="620" rx="24" fill="url(#bg)"/><rect width="1600" height="620" rx="24" fill="url(#grid)"/><g opacity=".12" stroke="#65e8d0" fill="none"><path d="M0 430 800 160 1600 430 800 700Z"/><path d="M0 360 800 90 1600 360"/><path d="M0 500 800 230 1600 500"/></g><text x="78" y="82" fill="#65efd2" font-family="monospace" font-size="18" letter-spacing="5">FINREASON · THE DISCOVERY ENGINE</text><text x="78" y="140" fill="#edf7ff" font-family="Arial,sans-serif" font-size="48" font-weight="700">From examples to verifiable programs</text><text x="80" y="178" fill="#91a9bd" font-family="Arial,sans-serif" font-size="20">Template learning  /  expression search  /  step composition  /  exact arithmetic</text><g transform="translate(800 370)"><g class="orbit"><ellipse rx="580" ry="185" fill="none" stroke="#31526b" stroke-width="2" stroke-dasharray="8 14"/><ellipse rx="440" ry="140" fill="none" stroke="#31526b" stroke-width="2" transform="rotate(-24)" opacity=".7"/><ellipse rx="300" ry="95" fill="none" stroke="#31526b" stroke-width="2" transform="rotate(24)" opacity=".7"/></g><g stroke="#4d8295" stroke-width="3" fill="none" opacity=".9"><path d="M-500 -65  -190 -8  100 -45  410 -5"/><path d="M-500 75 -190 -8 100 90 410 -5"/><path d="M-190 -8 100 -45 100 90"/><path d="M100 -45 410 -5"/></g><g class="pulse"><circle cx="-500" cy="-65" r="13" fill="#62e7ce" filter="url(#glow)"/><circle cx="-500" cy="75" r="13" fill="#62e7ce" filter="url(#glow)"/><circle cx="-190" cy="-8" r="21" fill="url(#violet)" filter="url(#glow)"/><circle cx="100" cy="-45" r="16" fill="#ffc979" filter="url(#glow)"/><circle cx="100" cy="90" r="16" fill="#ffc979" filter="url(#glow)"/><circle cx="410" cy="-5" r="23" fill="url(#teal)" filter="url(#glow)"/></g><g fill="#eaf8ff" font-family="monospace" font-size="17"><text x="-570" y="-105">EXAMPLES</text><text x="-570" y="125">LABELS</text><text x="-270" y="-55">LEARNED RULE</text><text x="10" y="-86">INTERMEDIATE</text><text x="20" y="137">CHAIN</text><text x="330" y="-48">EXACT CHECK</text></g><g fill="#b8c9d8" font-family="monospace" font-size="22"><text x="-265" y="42">I = P × r</text><text x="315" y="45">A = P + I</text></g><g class="traveler"><circle r="9" fill="#fff" filter="url(#glow)"><animateMotion dur="6s" repeatCount="indefinite" path="M-500 -65 L-190 -8 L100 -45 L410 -5"/></circle></g></g><g fill="#91a9bd" font-family="monospace" font-size="15"><text x="80" y="560">OBSERVE</text><text x="420" y="560">DISCOVER</text><text x="760" y="560">COMPOSE</text><text x="1120" y="560">VERIFY</text></g><path d="M80 578H1520" stroke="#29465b" stroke-width="2"/><path d="M80 578H1520" stroke="#5ee7cf" stroke-width="2" stroke-dasharray="90 1450"><animate attributeName="stroke-dashoffset" from="1540" to="0" dur="7s" repeatCount="indefinite"/></path><style>.orbit{transform-origin:0 0;animation:spin 32s linear infinite}.pulse{animation:pulse 3.2s ease-in-out infinite alternate}.traveler{animation:fade 6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{to{opacity:.52;filter:brightness(1.5)}}@keyframes fade{50%{opacity:.3}}@media(prefers-reduced-motion:reduce){.orbit,.pulse,.traveler{animation:none}}</style></svg>